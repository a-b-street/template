[workspace]
members = ["backend"]
resolver = "2"

[workspace.package]
edition = "2024"

[workspace.dependencies]
anyhow = "1.0"
geo = "0.33"
geojson = "1.0"
log = "0.4"
serde = "1.0"
utils = { git = "https://github.com/a-b-street/utils" }

# For local development, build dependencies in release mode once, but otherwise
# use dev profile and avoid wasm-opt.
[profile.dev.package."*"]
opt-level = 3
